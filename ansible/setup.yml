- name: Instalar dependências e executar frontend
  hosts: all
  become: yes

  vars:
    app_dir: /front
    url_backend: "{{ BACKEND_URL }}"
    frontend_dir: "{{ app_dir }}/app"

  tasks:
    - name: Atualizar cache do apt
      ansible.builtin.apt:
        update_cache: yes
      when: ansible_os_family == "Debian"

    - name: Instalar dependências básicas
      ansible.builtin.apt:
        name:
          - git
          - curl
          - ca-certificates
        state: present

    - name: Adicionar repositório NodeSource para Node.js 22.x
      ansible.builtin.shell: |
        curl -fsSL https://deb.nodesource.com/setup_22.x | bash -
      args:
        creates: /etc/apt/sources.list.d/nodesource.list

    - name: Instalar Node.js
      ansible.builtin.apt:
        name: nodejs
        state: present
        update_cache: yes

    - name: Encerrar processos do frontend Angular
      ansible.builtin.shell: |
        pkill -f '[n]g serve' || true
        pkill -f '[n]pm start' || true
      become_user: ubuntu

    - name: Clonar ou atualizar repositório
      ansible.builtin.git:
        repo: "https://github.com/TCC-Valkyrie/frontend-valkyrie.git"
        dest: "{{ app_dir }}"
        version: "{{ github_ref | default('main') }}"
        force: yes

    - name: Instalar dependências Node.js
      ansible.builtin.command:
        cmd: npm install
        chdir: "{{ frontend_dir }}"
      environment:
        npm_config_cache: /var/tmp/npm-cache

    - name: Instalar Nginx
      ansible.builtin.apt:
        name: nginx
        state: present
        update_cache: yes

    - name: Configurar ambiente de produção
      ansible.builtin.copy:
        dest: "{{ frontend_dir }}/src/environments/environment.ts"
        mode: "0644"
        owner: ubuntu
        group: ubuntu
        content: |
          export const environment = {
            production: true,
            apiUrl: '{{ url_backend }}',
          };

    - name: Ajustar permissões do frontend
      ansible.builtin.file:
        path: "{{ frontend_dir }}"
        owner: ubuntu
        group: ubuntu
        recurse: yes

    - name: Compilar frontend Angular
      ansible.builtin.command:
        cmd: npm run build
        chdir: "{{ frontend_dir }}"
      become_user: ubuntu

    - name: Desativar analytics do Angular
      become_user: ubuntu
      ansible.builtin.command:
        cmd: npx ng analytics off
        chdir: "{{ frontend_dir }}"
      changed_when: false

    - name: Localizar index.html compilado
      ansible.builtin.find:
        paths: "{{ frontend_dir }}/dist"
        patterns: index.html
        recurse: yes
        file_type: file
      register: angular_index

    - name: Validar build do Angular
      ansible.builtin.assert:
        that:
          - angular_index.matched | int > 0
        fail_msg: "Build Angular não gerou index.html em dist."

    - name: Criar diretório de publicação
      ansible.builtin.file:
        path: /var/www/angular
        state: directory
        owner: www-data
        group: www-data
        mode: "0755"

    - name: Publicar arquivos do Angular
      ansible.builtin.copy:
        src: "{{ angular_index.files[0].path | dirname }}/"
        dest: /var/www/angular/
        remote_src: yes
        owner: www-data
        group: www-data
        mode: preserve
      notify: Reiniciar Nginx

    - name: Configurar site Angular no Nginx
      ansible.builtin.copy:
        dest: /etc/nginx/sites-available/angular
        mode: "0644"
        content: |
          server {
              listen 4200 default_server;
              server_name _;

              root /var/www/angular;
              index index.html;

              location / {
                  try_files $uri $uri/ /index.html;
              }
          }
      notify: Reiniciar Nginx

    - name: Ativar site Angular
      ansible.builtin.file:
        src: /etc/nginx/sites-available/angular
        dest: /etc/nginx/sites-enabled/angular
        state: link
      notify: Reiniciar Nginx

    - name: Remover site padrão do Nginx
      ansible.builtin.file:
        path: /etc/nginx/sites-enabled/default
        state: absent
      notify: Reiniciar Nginx

    - name: Validar configuração Nginx
      ansible.builtin.command:
        cmd: nginx -t
      changed_when: false

    - name: Reiniciar Nginx
      ansible.builtin.systemd:
        name: nginx
        enabled: yes
        state: restarted

  handlers:
    - name: Reiniciar Nginx
      ansible.builtin.systemd:
        name: nginx
        state: restarted
